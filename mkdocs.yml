site_name: lab.mj

site_description: Sovereign Knowledge Laboratory

site_author: lab.mj

site_url: https://lab-mj.readthedocs.io

repo_url: https://github.com/lab-mj/lab-mj

repo_name: lab.mj

copyright: Copyright © lab.mj

theme:
  name: material

  logo: assets/logo.svg

  favicon: assets/favicon.png

  language: en

  features:

    - navigation.instant
    - navigation.instant.progress

    - navigation.tabs

    - navigation.tabs.sticky

    - navigation.sections

    - navigation.expand

    - navigation.tracking

    - navigation.indexes

    - navigation.top

    - toc.follow

    - search.highlight
    - search.suggest
    - search.share

    - content.code.copy

    - content.code.annotate

    - content.tabs.link

    - content.tooltips

    - announce.dismiss

  palette:

    - media: "(prefers-color-scheme: light)"

      scheme: default

      primary: indigo

      accent: blue

      toggle:

        icon: material/weather-night

        name: Dark mode

    - media: "(prefers-color-scheme: dark)"

      scheme: slate

      primary: black

      accent: cyan

      toggle:

        icon: material/weather-sunny

        name: Light mode

font:

  text: Inter

  code: JetBrains Mono

plugins:

  - search

  - awesome-pages

  - glightbox

  - section-index

  - mermaid2

  - redirects

  - macros

  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true

  - minify:
      minify_html: true

markdown_extensions:

  - admonition

  - attr_list

  - md_in_html

  - footnotes

  - tables

  - def_list

  - pymdownx.details

  - pymdownx.superfences

  - pymdownx.inlinehilite

  - pymdownx.snippets

  - pymdownx.mark

  - pymdownx.keys

  - pymdownx.caret

  - pymdownx.tilde

  - pymdownx.tasklist:
      custom_checkbox: true

  - pymdownx.emoji

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.tabbed:
      alternate_style: true

  - toc:
      permalink: true

extra:

  social:

    - icon: fontawesome/brands/github
      link: https://github.com

    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com

extra_css:

  - stylesheets/extra.css

